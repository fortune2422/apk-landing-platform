<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{title}}</title>
  <style>
    body{font-family: Roboto, Arial, sans-serif;background:#fff;margin:0}
    .hero{display:flex;gap:24px;align-items:center;padding:24px;max-width:980px;margin:0 auto}
    .icon{width:120px;height:120px;border-radius:24px}
    .info{flex:1}
    .title{font-size:28px;margin:0}
    .rating{color:#666}
    .desc{margin-top:12px;color:#333}
    .srow{display:flex;gap:12px;margin-top:18px}
    .ss{width:140px;height:300px;object-fit:cover;border-radius:10px}
    .btn{background:#1a73e8;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="hero">
    <img src="{{icon}}" class="icon" />
    <div class="info">
      <h1 class="title">{{title}}</h1>
      <div class="rating">{{subtitle}}</div>
      <p class="desc">{{description}}</p>
      <div style="margin-top:12px"><a class="btn" href="{{apk_url}}">{{button_text}}</a></div>
    </div>
  </div>
  <div style="max-width:980px;margin:18px auto;padding:0 24px">
    <div class="srow">{{screenshots}}</div>
  </div>
</body>
</html>
