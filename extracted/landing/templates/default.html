<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{title}}</title>
  <style>
    body{font-family: Roboto, Arial, sans-serif; background:#f2f2f2; margin:0}
    .wrap{max-width:900px;margin:24px auto;padding:20px}
    .card{display:flex;gap:20px;background:#fff;padding:24px;border-radius:12px;align-items:flex-start}
    .left{width:240px}
    .icon{width:100px;height:100px;border-radius:20px}
    .title{font-size:22px;margin:6px 0}
    .sub{color:#666}
    .screens{display:flex;gap:12px;margin-top:12px}
    .ss{width:120px;height:240px;object-fit:cover;border-radius:8px}
    .cta{margin-top:20px}
    .btn{display:inline-block;padding:14px 22px;background:#4285F4;color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
    .meta{color:#888;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="left">
        <img src="{{icon}}" class="icon" alt="icon" />
        <div class="meta">Updated: <!-- optional --> </div>
      </div>
      <div class="right">
        <div class="title">{{title}}</div>
        <div class="sub">{{subtitle}}</div>
        <div class="desc">{{description}}</div>
        <div class="screens">{{screenshots}}</div>
        <div class="cta">
          <a class="btn" href="{{apk_url}}">{{button_text}}</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
